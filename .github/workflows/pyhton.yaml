name: Run Python Script
on: [push]
jobs:
  run-Python:
   runs-on: ubuntu-latest
   steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-puthon@v4
      with:
        Python-version:  '3.11'

    - name: Run Python Script
      run: Python main.py